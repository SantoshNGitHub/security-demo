worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide nginx version from attackers
    server_tokens off;

    # Structured access log
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Rate limit zones
    # Auth endpoints: 5 req/min per IP (strict — brute-force protection)
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;
    # General API: 60 req/min per IP
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/m;
    # Concurrent connection limit
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    # Upstream: auth + user management service
    upstream security_app {
        server security-app:8080;
        keepalive 32;
    }

    # Upstream: product service
    upstream product_service {
        server product-service:8081;
        keepalive 16;
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name localhost;

        # TLS configuration (TLS 1.2+ only)
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security headers applied to every response
        add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options            "DENY"                                          always;
        add_header X-Content-Type-Options     "nosniff"                                       always;
        add_header X-XSS-Protection           "1; mode=block"                                 always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin"               always;
        add_header Content-Security-Policy    "default-src 'self'; frame-ancestors 'none';"   always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()"      always;

        # Concurrent connection limit per IP
        limit_conn conn_zone 20;

        # Login endpoint — strictest rate limit (5/min, no burst)
        location = /api/auth/login {
            limit_req zone=auth_zone burst=2 nodelay;
            limit_req_status 429;

            proxy_pass         http://security_app;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Signup — also rate limited to prevent account spam
        location = /api/auth/signup {
            limit_req zone=auth_zone burst=2 nodelay;
            limit_req_status 429;

            proxy_pass         http://security_app;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # All other auth endpoints (refresh, logout)
        location /api/auth/ {
            limit_req zone=auth_zone burst=5 nodelay;
            limit_req_status 429;

            proxy_pass         http://security_app;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Protected and public API
        location /api/ {
            limit_req zone=api_zone burst=20 nodelay;
            limit_req_status 429;

            proxy_pass           http://security_app;
            proxy_set_header     Host              $host;
            proxy_set_header     X-Real-IP         $remote_addr;
            proxy_set_header     X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header     X-Forwarded-Proto $scheme;
            proxy_http_version   1.1;
            proxy_set_header     Connection        "";
            proxy_read_timeout   60s;
            proxy_hide_header    X-Powered-By;
        }

        # Product service — strip /product-api prefix before forwarding
        # External: https://localhost/product-api/products
        # Internal: http://product-service:8081/products
        location /product-api/ {
            limit_req  zone=api_zone burst=20 nodelay;
            limit_req_status 429;

            proxy_pass           http://product_service/;
            proxy_set_header     Host              $host;
            proxy_set_header     X-Real-IP         $remote_addr;
            proxy_set_header     X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header     X-Forwarded-Proto $scheme;
            proxy_http_version   1.1;
            proxy_set_header     Connection        "";
            proxy_read_timeout   60s;
            proxy_hide_header    X-Powered-By;
        }

        # Block dot-file access (.git, .env, etc.)
        location ~ /\. {
            deny all;
            return 404;
        }
    }
}
